# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# Increased memory and tuned G1GC to avoid Garbage Collection bottlenecks with KSP, Hilt, and Jetpack Compose.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseG1GC -XX:MaxMetaspaceSize=1g

# Enable Gradle build cache to avoid re-executing unchanged tasks
org.gradle.caching=true

# Enable parallel execution for independent tasks/modules
org.gradle.parallel=true

# Configuration Cache skips the configuration phase when build scripts are unchanged
org.gradle.configuration-cache=true

# Memory settings for the Kotlin Daemon (handles Kotlin compilation & KSP code generation)
kotlin.daemon.jvmargs=-Xmx2048m

# Incremental compilation settings
kotlin.incremental=true

# Kotlin code style for this project
kotlin.code.style=official
android.disallowKotlinSourceSets=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
